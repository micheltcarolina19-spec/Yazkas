
# --- Configuración general ---
quarkus.application.name=yaskas
quarkus.banner.enabled=false
quarkus.log.level=INFO

# Puerto del servidor REST
quarkus.http.port=8080

# --- Base de datos PostgreSQL ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=peluqueria
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/yazkas

# Crea/actualiza las tablas automáticamente (conserva los datos)
quarkus.hibernate-orm.schema-management.strategy=update

# Muestra el SQL en consola
quarkus.hibernate-orm.log.sql=true
quarkus.datasource.db-version=12.22.0
# --- Swagger / OpenAPI ---
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Yazkas API
quarkus.smallrye-openapi.info-version=1.0
quarkus.smallrye-openapi.info-description=API REST para la gestión de clientes, mascotas, servicios y citas de la peluquería canina Yaska's.

# --- Adaptador de consola (opcional) ---
yazkas.console.enabled=false
